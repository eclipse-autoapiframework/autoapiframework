metamodel:
  name: Eclipse-autoapiframework-Metamodel
  version: 0.4.1
  scope: Middleware-independent metadata for definition and generation of standardized function APIs. Catalogue/interface metadata (for e.g., from VSS) is separated from function-specific configuration and runtime state where applicable.
  intent: Core interface types and essential metadata are required for standardized API definition and generation.

  enums:

    ASIL:
      - QM
      - A
      - B
      - C
      - D
    
    DataQuality:
      description: Runtime qualifier values. DataQuality is defined by the metamodel and the attribute qualityCode is not static metadata of a data interface instance.
      values:
        - uninitialized
        - invalid
        - valid


    Direction:
      - input
      - output

    RunType:
      - init
      - cyclic
      - event
      - terminate
    
    FunctionResult:
      description: Generic execution result only. It shall not encode function-specific diagnostic causes. Detailed errors are exposed through "Error interfaces".
      values:
        - success
        - failure
        - notAvailable
      
    ErrorSeverity:
      - information
      - warning
      - degraded
      - shutdown

    SupervisionType:
      - none
      - alive
      - deadline
      - logical
      - combined

  interfaceTypes:

    Data:
      description: Runtime data interfaces exchanged between applications or systems. Semantic properties may originate from VSS or an extended catalogue. Direction and the protection requirement are resolved for the function usage/configuration and are not intrinsic properties of the canonical VSS node.

      properties:
        name:
          mandatory: true
          datatype: string
          description: Unique interface or node name containing the fully qualified VSS node identifier, including its hierarchical path - Vehicle.<Domain/Subdomains>.<Signal>.
          example: Vehicle.Speed

        dataType:
          mandatory: true
          datatype: string
          description: Type of value transported by the interface.
          examples: 
           - float
           - uint8
           - uint16
           - boolean

        description:
          mandatory: true
          datatype: string
          description: Functional meaning of the data interface.

        unit:
          mandatory: true
          datatype: string
          description: Engineering unit of the data interface.
          example: km/h

        min:
          mandatory: true
          datatype: number
          description: Engineering minimum representable value. Null if not yet defined or not applicable.

        max:
          mandatory: true
          datatype: number
          description: Engineering maximum representable value. Null if not yet defined or not applicable.

        defaultValue:
          mandatory: true
          datatype: any
          description: Default or initialization value, where defined. Null if not yet defined or not applicable.

        resolution:
          mandatory: true
          datatype: number
          description: Smallest measurable quantization value - meant for scaling etc.

        precision:
          mandatory: true
          datatype: number
          description: Required numeric precision/number of meaningful digits.

        FuSa:
          mandatory: true
          datatype: boolean
          description: Indicates if the data interface is safety relevant or not.

        ASIL:
          mandatory: false
          datatype: enum
          enumRef: ASIL
          description: Safety classification associated with the data interface when it is safety-relevant.

        minUpdatePeriodMs:
          mandatory: true
          datatype: uint16
          description: Minimum interval between data updates in milliseconds.

        accuracy:
          mandatory: true
          datatype: string
          description: Expected measurement or estimation accuracy.
          example: ±0.2 km/h  

        direction:
          mandatory: true
          datatype: enum
          enumRef: Direction
          description: Defines the direction of the interface relative to the function/application being specified. input means the function consumes the data; output means the function provides the data. This is independent of the VSS sensor/actuator classification.
          example: input

        protectionRequired:
          mandatory: true
          datatype: boolean
          description: Indicates whether protection is required for transfer of the data between the function and its platform environment. The technical realization is platform-dependent and outside the scope of the metamodel/application specification.
          example: true

      runtimeCompanion:
        qualityCode:
          generatedAsSeparateRuntimeInformation: true
          recommendedNaming: "<DataPath>.Qualifier"
          datatype: enum
          enumRef: DataQuality
          description: Runtime quality/validity information accompanying the value. It is not a static metadata value such as min,max etc. 
          example: Vehicle.Speed.Qualifier

    Parameter:
      description: Calibration and configuration interface.

      properties:
        name:
          mandatory: true
          datatype: string
          description: Unique parameter identifier following the canonical VSS-style hierarchy, including its hierarchical path - Vehicle.<Domain/Subdomains>.<Parameter>.
          example: Vehicle.Brake.Gain

        dataType:
          mandatory: true
          datatype: string
          description: Datatype of the parameter value.
          examples: 
           - float
           - float[]
           - uint8
           - boolean

        defaultValue:
          mandatory: true
          datatype: any
          description: Default parameter value.

        description:
          mandatory: true
          datatype: string
          description: Meaning and intended usage of the parameter.

        unit:
          mandatory: true
          datatype: string
          description: Engineering unit where applicable.

        tunable:
          mandatory: true
          datatype: boolean
          description: Indicates whether the parameter may be tuned/configured after definition.

        min:
          mandatory: true
          datatype: number
          description: Minimum permitted parameter value, if defined/applicable.

        max:
          mandatory: true
          datatype: number
          description: Maximum permitted parameter value, if defined/applicable.

        dimensions:
          mandatory: false
          datatype: any with array indicated via []
          description: Shape of an array/map parameter. Omitted for scalars; e.g. [10] for a one-dimensional breakpoint vector and [7, 10] for a 7x10 map.
          example: Vehicle.Brake.GainMap[10]

    Scheduling:
      description: Lifecycle, activation, timing and execution-supervision contract of a runnable.

      properties:
        functionName:
          mandatory: true
          datatype: string
          description: Runnable or callable function name.
          namingConvention:
            - "<FunctionName>.Init"
            - "<FunctionName>.Step"
            - "<FunctionName>.Terminate"

        runType:
          mandatory: true
          datatype: enum
          enumRef: RunType
          description: Activation type of the runnable.

        description:
          mandatory: true
          datatype: string
          description: Purpose and execution intent of the runnable.

        cycleTimeMs:
          mandatory: conditional
          condition: "runType == cyclic"
          datatype: number
          description: Periodicity of cyclic execution in milliseconds.

        implementedASIL:
          mandatory: true
          datatype: enum
          enumRef: ASIL
          description: ASIL level for which this runnable/execution is implemented.

        previousRunnableRef:
          mandatory: false
          datatype: string
          description: Runnable that must precede this runnable when an ordering constraint exists.

        schedulingPolicy:
          mandatory: false
          datatype: string
          description: Scheduling mechanism or constraint, e.g. preemptive/non-preemptive.

        supervision:
          mandatory: true
          datatype: object

          properties:

            required:
              mandatory: true
              datatype: boolean

            type:
              mandatory: conditional
              condition: required == true
              datatype: enum[]
              values:
                - alive
                - deadline
                - logical

            alive:
              mandatory: conditional
              condition: type contains alive
              datatype: object
              properties:
                minIndications:
                  datatype: uint32
                  mandatory: false
                  description: Minimum expected number of alive indications within the reference cycle; this is not a lower tolerance margin.
                maxIndications:
                  datatype: uint32
                  mandatory: false
                  description: Maximum allowed number of alive indications within the reference cycle.
                referenceCycleMs:
                  datatype: number
                  mandatory: false
                  description: Reference cycle used to evaluate alive indications.
                
            deadline:
              mandatory: conditional
              condition: type contains deadline
              datatype: object
              description: Deadline supervision verifies that execution completes within the configured maximum execution-time limit.
              properties:
                maxExecutionTimeMs:
                  datatype: number
                  mandatory: true
                  description: Maximum allowed execution time for deadline supervision.

            logical:
              mandatory: conditional
              condition: type contains logical
              datatype: object
              properties:
                predecessorRefs: {datatype: "string[]", mandatory: false}
                successorRefs: {datatype: "string[]", mandatory: false}

        stackSizeBytes:
          mandatory: false
          datatype: uint32
          description: Required stack size when relevant for deployment/integration.

        executionResult:
          mandatory: true
          datatype: enum
          enumRef: FunctionResult
          description: Generic result returned/reported for function execution. The adapter may report a failure indication it can observe (e.g. due to invocation/transport/timeout). It shall not synthesize detailed function-internal diagnostic causes nor reports any errors for fault logging.

    Error:
      status: candidate
      description: Lightweight function-specific error/status interface, separated from the generic FunctionResult. This candidate model does not redefine DSM/DTC or event-memory handling. It conveys application-level error/status information that can be consumed by relevant middleware or platform components for diagnostic handling and logging. Optional diagnostic metadata may be provided where required to support downstream diagnostic configuration during integration.

      properties:
        name:
          mandatory: true
          datatype: string
          description: Function-specific error interface name. Standard canonical form - <FunctionName>.<ErrorName>.ErrorStatus
          example: WheelSpeedCalc.RangeError.ErrorStatus

        dataType:
          mandatory: true
          datatype: string
          description: Datatype of the exposed error interface.
          examples:
           - boolean
           - enum

        description:
          mandatory: true
          datatype: string
          description: Meaning of the error and its trigger scenario.

        severity:
          mandatory: false
          datatype: enum
          enumRef: ErrorSeverity
          description: Optional functional impact/severity associated with the error, when required for downstream diagnostic configuration.

        maturationTimeMs:
          mandatory: true
          datatype: number in milliseconds
          description: Time for which the error condition must persist before it is considered matured to be set, when required by the diagnostic/integration concept.

        resetTimeMs:
          mandatory: false
          recommendation: recommended
          datatype: number
          description: Optional de-maturation/reset time before clearing the error, when required by the diagnostic/integration concept.

        resetCondition:
          mandatory: false
          recommendation: recommended
          datatype: string
          description: Optional condition that clears the error, when required by the diagnostic/integration concept.

        dependencyRefs:
          mandatory: false
          datatype: "string[]"
          description: Optional references to related upstream error interfaces that may propagate/trigger this error, when required for integration.

        fallbackBehavior:
          mandatory: false
          datatype: string
          description: Optional function-level fallback/degradation behavior associated with the error.

        raisesSafetyReactionRefs:
          mandatory: false
          datatype: "string[]"
          description: Optional references to safety reactions associated with this error - <SafetyCondition>.SafetyConditionStatus.

  modelingRules:
    - id: MR-001
      rule: >-
        VSS sensor/actuator type and function input/output direction are different
        concepts. Direction shall be assigned per function-interface usage.

    - id: MR-002
      rule: >-
        Runtime quality shall not be populated as a static constant in a function
        specification. Quality information shall be transported/represented at runtime.

    - id: MR-003
      rule: >-
        Generic FunctionResult shall be limited to execution outcome and shall not
        replace function-specific diagnostic/error interfaces.

    - id: MR-004
      rule: >-
        The metamodel specifies whether protection is required for an interface. The
        technical realization of that protection is platform-dependent and outside the scope
        of the metamodel/application specification; it may be provided by the operating system,
        middleware, communication stack, or other platform mechanisms and shall be
        configured/enabled/implemented during integration.

    - id: MR-005
      rule: >-
        Unknown metadata shall remain null according to the consuming schema/tool
        and shall not be replaced with invented plausible values.
