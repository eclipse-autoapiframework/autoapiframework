# TEMPLATE - Function Specification File (*.afs.yaml)
#
# Copy this file, rename it to <YourFunctionName>.afs.yaml and fill it in.
# Every "row" below is one signal/parameter/runnable and MUST provide exactly
# one value per entry listed under "columns", in the same order.
# Remove this header and all "# <-- ..." hints once the file is filled in.
# Unknown metadata shall remain null/omitted as allowed by the consuming schema;
# do not invent plausible values only to complete an example.

functionSpecification:
  name: <YourFunctionName>     # e.g. SpeedHazardDetection
  version: 1.0.0               # semantic version of this function specification
  metaModelRef:
    name: Eclipse-autoapiframework-Metamodel
    version: 0.4.1             # meta model version this file was written against

  description: >-
    <One or two sentences describing what this function does.>

  # -----------------------------------------------------------------------
  # 1) DATA INTERFACES
  #    Reuse canonical VSS paths whenever equivalent semantics already exist.
  #    New Vehicle.* paths shall only be introduced as explicitly approved
  #    extensions when no suitable standard VSS node exists.
  #
  #    Function-specific properties:
  #      direction: input | output
  #      protectionRequired: true | false
  #    direction is relative to the function/application being specified and
  #    is independent of the VSS sensor/actuator classification.
  #    protectionRequired states only whether protection is required; the
  #    technical protection mechanism is selected during integration.
  #
  #    FuSa: true | false
  #    ASIL is optional and should be provided when the data interface is
  #    safety-relevant. Do not populate ASIL mechanically for FuSa: false.
  #
  #    qualityCode is runtime companion information associated with the Data
  #    interface. The qualifier shall be indicated explicitly as a runtime
  #    enum interface, but shall not repeat normal Data metadata such as
  #    min/max/default/resolution/precision.
  # -----------------------------------------------------------------------
  dataInterfaces:
    - name: <CanonicalVSSOrApprovedExtensionPath>   # Vehicle.<Domain/Subdomains>.<Signal>
      direction: input
      dataType: float
      description: <Functional meaning of the signal.>
      unit: <unit>
      min: <min>
      max: <max>
      defaultValue: <defaultValue>
      resolution: <resolution>
      precision: <precision>
      FuSa: true
      ASIL: <QM|A|B|C|D>
      minUpdatePeriodMs: <minUpdatePeriodMs>
      accuracy: <expected accuracy>
      protectionRequired: false
      runtimeCompanion:
        qualityCode:
          name: <CanonicalVSSOrApprovedExtensionPath>.Qualifier   # Vehicle.<Domain/Subdomains>.<Signal>.Qualifier
          datatype: enum
          enumRef: DataQuality

  # -----------------------------------------------------------------------
  # 2) PARAMETERS
  #    Parameter identifiers shall also follow the VSS-style hierarchical
  #    Vehicle.<Domain>.<Subdomain>.<Parameter> naming approach. Reuse an
  #    existing catalogue entry where available; otherwise use an explicitly
  #    approved extension under the relevant semantic branch.
  #    dimensions is optional and only needed for array/map parameters.
  #    e.g. [10] for a vector or [7, 10] for a 7x10 map.
  # -----------------------------------------------------------------------
  parameters:
    - name: <CanonicalVSSOrApprovedExtensionPath>   # Vehicle.<Domain>.<Subdomain>.<Parameter>
      dataType: float
      defaultValue: <defaultValue>
      description: <Meaning and intended usage of the parameter.>
      unit: <unit>
      tunable: false
      min: <min>
      max: <max>
      dimensions: [<size>]

  # -----------------------------------------------------------------------
  # 3) ERROR INTERFACES - CANDIDATE / PROVISIONAL
  #    Lightweight function-specific error/status interfaces, separate from
  #    FunctionResult. This candidate model does not redefine DSM/DTC or
  #    event-memory handling. Application-level error/status information can
  #    be consumed by middleware/platform diagnostic handling and logging.
  #    Optional diagnostic metadata may be provided where required to support
  #    downstream diagnostic configuration during integration. In v0.4.1,
  #    maturationTimeMs is mandatory in the candidate Error type; severity,
  #    reset/dependency/fallback/safety-reaction metadata are optional.
  #    Naming convention: <FunctionName>.<ErrorName>.ErrorStatus
  # -----------------------------------------------------------------------
  errorInterfaces:
    - name: <YourFunctionName>.<ErrorName>.ErrorStatus
      dataType: boolean
      description: <Meaning of the error and its trigger scenario.>
      severity: degraded  # optional
      maturationTimeMs: <maturationTimeMs>
      resetTimeMs: <resetTimeMs>  # optional/recommended
      resetCondition: <Condition that clears the error.>  # optional/recommended
      dependencyRefs: []  # optional
      fallbackBehavior: <Function-level fallback/degradation behavior.>  # optional
      raisesSafetyReactionRefs: []  # optional

  # -----------------------------------------------------------------------
  # 4) SCHEDULING
  #    Naming convention: <FunctionName>.Init / .Step / .Terminate
  #    cycleTimeMs is present only for runType: cyclic.
  #    previousRunnableRef is optional and is used only when an explicit
  #    predecessor/order dependency exists. It does not mean "immediately
  #    before" and no System.Startup convention is assumed here.
  #
  #    executionResult describes the runtime result contract. The static
  #    specification shall not hard-code success/failure/notAvailable.
  #
  #    supervision is nested within each scheduling entry. When required is
  #    true, list the selected supervision types and only their relevant
  #    configuration objects.
  # -----------------------------------------------------------------------
  scheduling:
    - functionName: <YourFunctionName>.Init
      runType: init
      description: <Initialize internal states.>
      implementedASIL: QM
      executionResult:
        type: FunctionResult
      supervision:
        required: false

    - functionName: <YourFunctionName>.Step
      runType: cyclic
      description: <Evaluate inputs and calculate outputs.>
      cycleTimeMs: <cycleTimeMs>
      implementedASIL: QM
      previousRunnableRef: <OtherFunction>.Step #Optional
      executionResult:
        type: FunctionResult
      supervision:
        required: false
      # supervision:
      #   required: true
      #   type:
      #     - alive
      #     - deadline
      #     - logical
      #   alive:
      #     # Minimum expected alive indications in the reference cycle;
      #     # this is not a lower tolerance margin.
      #     minIndications: <minIndications>
      #     maxIndications: <maxIndications>
      #     referenceCycleMs: <referenceCycleMs>
      #   deadline:
      #     maxExecutionTimeMs: <maxExecutionTimeMs>
      #   logical:
      #     predecessorRefs: []
      #     successorRefs: []
      # schedulingPolicy: <e.g. preemptive/non-preemptive>
      # stackSizeBytes: <stackSizeBytes>

    - functionName: <YourFunctionName>.Terminate
      runType: terminate
      description: <Shutdown cleanup.>
      implementedASIL: QM
      previousRunnableRef: <YourFunctionName>.Step
      executionResult:
        type: FunctionResult
      supervision:
        required: false
