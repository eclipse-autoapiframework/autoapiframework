metamodel:
  name: Eclipse-autoapiframework-Metamodel
  version: 0.3.0
  scope: Core standardization baseline
  intent: Core interface types and essential metadata required for standardized API definition and generation.

  enums:

    ASIL:
      - QM
      - A
      - B
      - C
      - D

    DataQuality:
      - Uninitialized
      - Invalid
      - Valid

    Direction:
      - input
      - output            

    RunType:
      - init
      - cyclic
      - event
      - terminate

    Protection:
      - none
      - complement    # can be discussed if complement is sent in another call or together with the signal.      

    FunctionResult:   # only used by function adapter to return the result of the triggered vehicle function.
      - ok
      - notAvailable
      - invalidInput    
      - complementError
      - rangeError        
      - timeout          
      - calculationError                      
      - internalError 

  interfaceTypes:

    Data:
      description: Runtime data interfaces exchanged between applications or systems.

      properties:

        namePath:
          mandatory: true
          dataType: string
          description: Unique interface or node name. Based on canonical VSS path of the data interface - Vehicle.<Domain/Subdomains>.<Signal>
          example: Vehicle.Speed

        dataType:
          mandatory: true
          dataType: string
          description: Type of the value transported by the interface.
          examples:
            - float
            - uint8
            - boolean

        description:
          mandatory: true
          dataType: string
          description: Functional meaning of the signal.

        unit:
          mandatory: true
          dataType: string
          description: Engineering unit of the signal.
          example: km/h

        min:
          mandatory: true
          dataType: number
          description: Minimum representable engineering value.

        max:
          mandatory: true
          dataType: number
          description: Maximum representable engineering value.

        defaultValue:
          mandatory: true
          dataType: any
          description: Default or initialization value.

        resolution:
          mandatory: true
          dataType: number
          description: Smallest measurable quantization value - meant for scaling etc.

        precision:
          mandatory: true
          dataType: number
          description: Number of meaningful digits.

        ASIL:
          mandatory: true
          dataType: enum
          enumRef: ASIL
          description: Safety classification when the data is safety-relevant.

        minUpdatePeriodMs:
          mandatory: true
          dataType: uint32
          description: Minimum allowed update interval.

        qualityCode:
          mandatory: true
          dataType: enum
          enumRef: DataQuality
          description: Runtime quality state.
          note: It is not a static info and hence shall be transformed into a separate signal as it gets updated runtime. e.g., Vehicle.Speed.Value -> For signal value and Vehicle.Speed.Qualifier -> For quality code
        
        accuracy:
          mandatory: true
          dataType: string
          description: Expected measurement or estimation accuracy.
          example: ±0.2 km/h  

    Parameter:
      description: Calibration and configuration interfaces.

      properties:

        namePath:
          mandatory: true
          dataType: string
          description: Unique parameter name. Based on canonical VSS path of the parameter - Vehicle.<Domain/Subdomains>.<Parameter>
          example: Vehicle.Brake.Gain

        dataType:
          mandatory: true
          dataType: string
          description: Datatype of parameter value.

        defaultValue:
          mandatory: true
          dataType: any
          description: Default parameter value.

        description:
          mandatory: true
          dataType: string
          description: Meaning and intended usage of the parameter.

        unit:
          mandatory: true
          dataType: string
          description: Engineering unit if numeric.

        protection:
          mandatory: true
          dataType: enum
          enumRef: Protection          
          description: Defines the required signal protection.
          example: complement                 
          
        direction:
          mandatory: true
          dataType: enum
          enumRef: Direction          
          description: Defines if the signal is either an input or output signal.
          example: input     

    Scheduling:
      description: Lifecycle and execution interfaces.

      properties:

        functionName:
          mandatory: true
          dataType: string
          description: Runnable or callable function name.

          namingConvention:
            - "<FunctionName>.Init"
            - "<FunctionName>.Step"
            - "<FunctionName>.Terminate"

        runType:
          mandatory: true
          dataType: enum
          enumRef: RunType
          description: Activation type of the runnable.

        description:
          mandatory: true
          dataType: string
          description: Purpose of the runnable.

        cycleTimeMs:
          mandatory: true
          dataType: uint32
          description: Runnable periodicity.

        ASIL:
          mandatory: true
          dataType: enum
          enumRef: ASIL
          description: Safety classification when the scheduler is safety-relevant.          

        previousRunnableRef:
          mandatory: true
          dataType: string
          description: Runnable that shall execute before this runnable.
          example: SensorFusion.Step
    